<div class="create-post">
  <div class="create-post__row" (click)="expand()">
    <div class="create-post__avatar">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
    </div>
    <div class="create-post__placeholder" [class.hidden]="isExpanded()">
      بم تفكر اليوم؟
    </div>
  </div>

  @if (isExpanded()) {
    <form [formGroup]="form" (ngSubmit)="submit()" class="create-post__form">
      <textarea
        formControlName="content"
        class="create-post__textarea"
        placeholder="شارك فكرة، اقتباساً، أو سؤالاً..."
        rows="4"
        dir="rtl"
        autofocus
      ></textarea>

      <div class="create-post__actions">
        <button type="button" class="create-post__cancel" (click)="cancel()">إلغاء</button>
        <button type="submit" class="create-post__submit" [disabled]="form.invalid || isLoading()">
          @if (isLoading()) { جارٍ النشر... } @else { نشر }
        </button>
      </div>
    </form>
  }
</div>
