<div class="ad-page">
  <h1 class="ad-page__title">الرئيسية</h1>

  @if (stats(); as s) {
    <div class="ad-stats">
      <div class="ad-stat-card">
        <div class="ad-stat-card__icon ad-stat-card__icon--users">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
        </div>
        <div class="ad-stat-card__body">
          <span class="ad-stat-card__value">{{ s.totalUsers }}</span>
          <span class="ad-stat-card__label">مستخدم</span>
        </div>
      </div>

      <div class="ad-stat-card">
        <div class="ad-stat-card__icon ad-stat-card__icon--posts">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M21 6.5l-4-4-9.5 9.5-1.5 5.5 5.5-1.5L21 6.5z"/>
          </svg>
        </div>
        <div class="ad-stat-card__body">
          <span class="ad-stat-card__value">{{ s.totalPosts }}</span>
          <span class="ad-stat-card__label">منشور</span>
        </div>
      </div>

      <div class="ad-stat-card">
        <div class="ad-stat-card__icon ad-stat-card__icon--novels">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/>
          </svg>
        </div>
        <div class="ad-stat-card__body">
          <span class="ad-stat-card__value">{{ s.totalNovels }}</span>
          <span class="ad-stat-card__label">رواية منشورة</span>
        </div>
      </div>

      <div class="ad-stat-card">
        <div class="ad-stat-card__icon ad-stat-card__icon--revenue">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
          </svg>
        </div>
        <div class="ad-stat-card__body">
          <span class="ad-stat-card__value">{{ s.totalRevenue }} ج.م</span>
          <span class="ad-stat-card__label">إجمالي الإيرادات</span>
        </div>
      </div>
    </div>
  }
</div>
