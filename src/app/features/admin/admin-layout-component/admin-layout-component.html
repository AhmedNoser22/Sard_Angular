<div class="admin-shell" [class.admin-shell--open]="isSidebarOpen()">

  @if (isSidebarOpen()) {
  <div class="admin-backdrop" (click)="closeSidebar()"></div>
  }

  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <div class="admin-sidebar__logo-wrap">
        <svg class="logo-ornament" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 2 L34 10 L42 10 L36 16 L38 24 L30 20 L22 24 L24 16 L18 10 L26 10 Z" fill="none" stroke="#e8a98a"
            stroke-width="1.2" />
          <circle cx="30" cy="13" r="2" fill="#e8a98a" opacity="0.6" />
          <line x1="10" y1="36" x2="50" y2="36" stroke="#e8a98a" stroke-width="0.8" opacity="0.4" />
          <circle cx="10" cy="36" r="1.5" fill="#e8a98a" opacity="0.4" />
          <circle cx="50" cy="36" r="1.5" fill="#e8a98a" opacity="0.4" />
          <circle cx="30" cy="36" r="1.5" fill="#e8a98a" opacity="0.6" />
        </svg>
        <span class="admin-sidebar__brand-name">سرد</span>
      </div>
    </div>

    <nav class="admin-sidebar__nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
        class="admin-sidebar__link" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
        </svg>
        <span>الرئيسية</span>
      </a>

      <a routerLink="/admin/users" routerLinkActive="active" class="admin-sidebar__link" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path
            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
        </svg>
        <span>المستخدمون</span>
      </a>

      <a routerLink="/admin/posts" routerLinkActive="active" class="admin-sidebar__link" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M21 6.5l-4-4-9.5 9.5-1.5 5.5 5.5-1.5L21 6.5zm-11 8.5l-3 1 1-3 7-7 2 2-7 7z" />
        </svg>
        <span>المنشورات</span>
      </a>

      <a routerLink="/admin/novels" routerLinkActive="active" class="admin-sidebar__link" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path
            d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z" />
        </svg>
        <span>الروايات</span>
      </a>

      <a href="https://localhost:7002/hangfire" target="_blank" class="admin-sidebar__link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" />
        </svg>
        <span>مهام الخلفية</span>
      </a>
    </nav>

    <button type="button" class="admin-sidebar__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path
          d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
      </svg>
      <span>تسجيل الخروج</span>
    </button>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button type="button" class="admin-topbar__toggle" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z" />
        </svg>
      </button>
      <span class="admin-topbar__title">المدير العام</span>
    </header>

    <div class="admin-content">
      <router-outlet />
    </div>
  </div>
</div>
