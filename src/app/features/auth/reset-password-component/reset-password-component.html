<div class="auth-wrapper">
  <svg class="bg-svg" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g class="page-flip">
      <path d="M334 440 Q420 460 490 510 Q500 540 490 580 Q420 620 334 640 Z" fill="#fef8ee" opacity="0.85" />
    </g>
  </svg>
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="logo-ornament" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 2 L34 10 L42 10 L36 16 L38 24 L30 20 L22 24 L24 16 L18 10 L26 10 Z" fill="none" stroke="#c0785a"
          stroke-width="1.2" />
        <circle cx="30" cy="13" r="2" fill="#c0785a" opacity="0.5" />
        <line x1="10" y1="36" x2="50" y2="36" stroke="#c0785a" stroke-width="0.8" opacity="0.4" />
        <circle cx="10" cy="36" r="1.5" fill="#c0785a" opacity="0.4" />
        <circle cx="50" cy="36" r="1.5" fill="#c0785a" opacity="0.4" />
        <circle cx="30" cy="36" r="1.5" fill="#c0785a" opacity="0.6" />
      </svg>
      <h1 class="logo-text">سرد</h1>
      <p class="logo-sub">حيث كل رواية تنبض</p>
    </div>

    <div class="auth-header">
      <h2>إنشاء كلمة مرور جديدة</h2>
      <p>اختر كلمة مرور قوية لحماية حسابك</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="field-group">
        <label>كلمة المرور الجديدة</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
          </span>
          <input [type]="showPassword() ? 'text' : 'password'" formControlName="newPassword"
            placeholder="أدخل كلمة المرور الجديدة" dir="rtl" />
          <button type="button" class="toggle-eye" (click)="togglePassword()">
            @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      <div class="field-group">
        <label>تأكيد كلمة المرور الجديدة</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
          </span>
          <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword"
            placeholder="أعد إدخال كلمة المرور الجديدة" dir="rtl" />
          <button type="button" class="toggle-eye" (click)="toggleConfirmPassword()">
            @if (showConfirmPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      <div class="password-hints">
        <p class="hints-title">يجب أن تحتوي كلمة المرور على:</p>
        <ul class="hints-list">
          <li>
            <span class="hint-icon hint-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            8 أحرف على الأقل
          </li>
          <li>
            <span class="hint-icon hint-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            حرف كبير وصغير
          </li>
          <li>
            <span class="hint-icon hint-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            رقم واحد على الأقل
          </li>
          <li>
            <span class="hint-icon hint-neutral">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            رمز خاص (اختياري)
          </li>
        </ul>
      </div>

      @if (errorMessage()) {
      <p class="error-msg">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading() || form.invalid">
        @if (isLoading()) { } @else { تعيين كلمة المرور الجديدة }
      </button>
      <button type="button" class="back-btn" (click)="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        العودة لإدخال رمز التحقق
      </button>

    </form>
  </div>
</div>
