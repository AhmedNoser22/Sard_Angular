<div class="auth-wrapper">
  <svg class="bg-svg" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g class="page-flip">
      <path d="M334 440 Q420 460 490 510 Q500 540 490 580 Q420 620 334 640 Z" fill="#fef8ee" opacity="0.85" />
    </g>
  </svg>
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="logo-ornament" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 2 L34 10 L42 10 L36 16 L38 24 L30 20 L22 24 L24 16 L18 10 L26 10 Z" fill="none" stroke="#c0785a"
          stroke-width="1.2" />
        <circle cx="30" cy="13" r="2" fill="#c0785a" opacity="0.5" />
        <line x1="10" y1="36" x2="50" y2="36" stroke="#c0785a" stroke-width="0.8" opacity="0.4" />
        <circle cx="10" cy="36" r="1.5" fill="#c0785a" opacity="0.4" />
        <circle cx="50" cy="36" r="1.5" fill="#c0785a" opacity="0.4" />
        <circle cx="30" cy="36" r="1.5" fill="#c0785a" opacity="0.6" />
      </svg>
      <h1 class="logo-text">سرد</h1>
      <p class="logo-sub">حيث كل رواية تنبض</p>
    </div>

    <div class="auth-header">
      <h2>أدخل رمز التحقق</h2>
      <p>لقد أرسلنا رمز التحقق إلى بريدك الإلكتروني</p>
    </div>

    <div class="email-display">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c0785a" stroke-width="1.5" width="48" height="48">
        <rect x="2" y="4" width="20" height="16" rx="2" />
        <path d="M2 7l10 7 10-7" />
      </svg>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="otp-wrapper">
        <input type="text" formControlName="code" maxlength="6" placeholder="● ● ● ● ● ●" class="otp-input"
          inputmode="numeric" dir="ltr" />
      </div>

      @if (errorMessage()) {
      <p class="error-msg">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
      <p class="success-msg">{{ successMessage() }}</p>
      }

      <div class="resend-row">
        <span class="resend-label">لم يصل الرمز بعد؟</span>
        <button type="button" class="resend-btn" [disabled]="countdown() > 0 || isResending()" (click)="resendCode()">
          @if (countdown() > 0) {
          ({{ countdown().toString().padStart(2, '0') }}) إعادة إرسال الرمز
          } @else {
          إعادة إرسال الرمز
          }
        </button>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading() || form.invalid">
        @if (isLoading()) { } @else { تحقق من الرمز }
      </button>

    </form>

    <p class="auth-footer-link">
      <a routerLink="/auth/login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        العودة إلى تسجيل الدخول
      </a>
    </p>
  </div>
</div>
