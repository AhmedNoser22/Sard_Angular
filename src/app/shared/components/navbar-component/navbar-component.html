<nav class="app-nav">
  <div class="app-nav__side">
    <details class="app-nav__mobile-menu" #mobileMenu>
      <summary class="app-nav__icon-btn app-nav__mobile-trigger" title="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z" />
        </svg>
      </summary>
      <div class="app-nav__mobile-panel">
        <a routerLink="/highlights" routerLinkActive="app-nav__mobile-link--active" class="app-nav__mobile-link"
          (click)="mobileMenu.removeAttribute('open')">الأثر</a>
        <a routerLink="/nabd" routerLinkActive="app-nav__mobile-link--active" class="app-nav__mobile-link"
          (click)="mobileMenu.removeAttribute('open')">نبض</a>
        <a routerLink="/profile" class="app-nav__mobile-link" [class.app-nav__mobile-link--active]="isHomeActive()"
          (click)="mobileMenu.removeAttribute('open')">الرئيسية</a>
        <a routerLink="/novel" routerLinkActive="app-nav__mobile-link--active" class="app-nav__mobile-link"
          (click)="mobileMenu.removeAttribute('open')">رواياتي</a>
      </div>
    </details>

    <div class="notif-wrapper">
      <button type="button" class="app-nav__icon-btn" (click)="toggleNotifications(); $event.stopPropagation()"
        title="الإشعارات">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path
            d="M12 22a2.2 2.2 0 0 0 2.2-2.2h-4.4A2.2 2.2 0 0 0 12 22zm7-6.2V11c0-3.35-2.13-6.16-5.5-6.9V3.5a1.5 1.5 0 0 0-3 0v.6C7.13 4.84 5 7.64 5 11v4.8L3 17.8v1h18v-1z" />
        </svg>
        @if (notifService.unreadCount() > 0) {
        <span class="app-nav__badge">{{ notifService.unreadCount() }}</span>
        }
      </button>

      @if (showNotifications()) {
      <app-notifications-panel (close)="showNotifications.set(false)" />
      }
    </div>

    <a routerLink="/novel" class="app-nav__icon-btn" title="مكتبتي">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12 6.2c-1.6-1.4-3.7-2.2-6.3-2.2H4.2v14.3h1.5c2.6 0 4.7.8 6.3 2.2 1.6-1.4 3.7-2.2 6.3-2.2h1.5V4h-1.5c-2.6 0-4.7.8-6.3 2.2z" />
        <path d="M12 6.2v14.3" />
      </svg>
    </a>
  </div>

  <div class="app-nav__links">
    <a routerLink="/highlights" routerLinkActive="app-nav__link--active" class="app-nav__link">الأثر</a>
    <a routerLink="/nabd" routerLinkActive="app-nav__link--active" class="app-nav__link">نبض</a>
    <a routerLink="/profile" class="app-nav__link" [class.app-nav__link--active]="isHomeActive()">الرئيسية</a>
    <a routerLink="/novel" routerLinkActive="app-nav__link--active" class="app-nav__link">رواياتي</a>
  </div>

  <a routerLink="/profile" class="app-nav__brand">
    <svg class="brand-mark app-nav__brand-star" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">
      <path class="brand-mark__outline"
        d="M12 2.5l2.47 6.24 6.53.5-5.02 4.4 1.53 6.36L12 16.6l-5.51 3.4 1.53-6.36-5.02-4.4 6.53-.5L12 2.5z" fill="none"
        stroke="#c0785a" stroke-width="1.3" stroke-linejoin="round" pathLength="100" />
      <circle class="brand-mark__dot" cx="12" cy="12.2" r="1.6" fill="#c0785a" opacity="0.55" />
      <line x1="4" y1="26" x2="20" y2="26" stroke="#c0785a" stroke-width="0.7" opacity="0.45" />
      <circle cx="4" cy="26" r="1" fill="#c0785a" opacity="0.45" />
      <circle cx="20" cy="26" r="1" fill="#c0785a" opacity="0.45" />
      <circle cx="12" cy="26" r="1.2" fill="#c0785a" opacity="0.7" />
    </svg>
    <span class="app-nav__brand-name">سرد</span>
  </a>
</nav>
